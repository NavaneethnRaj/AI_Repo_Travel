services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - trip-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      DATA_DIR: /data
      OPENUI_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  trip-data:
