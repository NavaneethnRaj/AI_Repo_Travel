services:
  app:
    image: "${COMPOSE_PROJECT_NAME}-app-test"
    build:
      target: test
    network_mode: none
    env_file: !reset []
    tmpfs:
      - /app/node_modules/.vite-temp:mode=1777
    ports: !reset []
    volumes: !reset []
    healthcheck:
      disable: true
    command: ["npm", "run", "test:offline"]
